<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registro</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Checkbox invisível que controla a transição -->
        <input type="checkbox" id="toggle" class="toggle">

        <div class="content">

            <!-- Formulário de Cadastro (Sign Up) -->
            <div class="form-container sign-up-container">
                <form class="form">
                    <h2 class="title">Create Account</h2>
                    <div class="social-media">
                        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" aria-label="Google"><i class="fab fa-google-plus-g"></i></a>
                        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                    <p class="description">or use your email for registration:</p>

                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Name" required>
                    </div>
                    <div class="input-container">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email" required>
                    </div>
                    <div class="input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                </form>
            </div>

            <!-- Formulário de Login (Sign In) -->
            <div class="form-container sign-in-container">
                <form class="form">
                    <h2 class="title">Sign In To Developer</h2>
                    <div class="social-media">
                        <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" aria-label="Google"><i class="fab fa-google-plus-g"></i></a>
                        <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                    </div>
                    <p class="description">or use your email account:</p>

                    <div class="input-container">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email" required>
                    </div>
                    <div class="input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <a href="#" class="forgot-password">Forgot your password?</a>
                    <button type="submit" class="btn">Sign In</button>
                </form>
            </div>

            <!-- Painel Deslizante Verde (Overlay) -->
            <div class="overlay-container">
                <div class="overlay">
                    
                    <!-- Painel Esquerdo: aparece quando está na tela de Cadastro -->
                    <div class="overlay-panel overlay-left">
                        <h2 class="title">Welcome Back!</h2>
                        <p class="description">To keep connected with us please login with your personal info</p>
                        <label for="toggle" class="btn btn-outline">Sign In</label>
                    </div>

                    <!-- Painel Direito: aparece quando está na tela de Login -->
                    <div class="overlay-panel overlay-right">
                        <h2 class="title">Hello, Friend!</h2>
                        <p class="description">Enter your personal details and start journey with us</p>
                        <label for="toggle" class="btn btn-outline">Sign Up</label>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
